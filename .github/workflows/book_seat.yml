name: Daily Office Seat Booking

on:
  repository_dispatch:
    types: [trigger-booking]
  workflow_dispatch:
    inputs:
      targetDate:
        description: 'Target Date (TODAY, TOMORROW, or YYYY-MM-DD - leave empty for default)'
        required: false
        default: ''
      room:
        description: 'Room Number (e.g. 115 - leave empty for default)'
        required: false
        default: ''
  schedule:
    # 18:31 UTC corresponds to 12:01 AM IST (UTC+5:30) every day
    - cron: '31 18 * * *'

jobs:
  book-seat:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      TZ: 'Asia/Kolkata'
      SESSION_DATA: ${{ secrets.SESSION_DATA }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      TARGET_DATE: ${{ github.event.inputs.targetDate || github.event.client_payload.targetDate }}
      TARGET_ROOM: ${{ github.event.inputs.room || github.event.client_payload.room }}

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🎭 Install Playwright Chromium & System Dependencies
        run: npx playwright install --with-deps chromium

      - name: 🚀 Run Seat Booking Bot
        run: node book_seat.js

      - name: 📸 Upload Proof Screenshots & Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: booking-results-${{ github.run_id }}
          path: |
            *.png
            booking_history.log
          retention-days: 7
